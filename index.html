<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Schedule - Google Calendar View</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .hour-row { height: 60px; }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header / Google Calendar Navigation -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between z-20 shadow-sm">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2 text-gray-700 font-medium text-xl">
                <svg class="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
                </svg>
                <span class="text-gray-600 font-semibold text-lg">Calendar</span>
            </div>
            <button class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-1.5 rounded-full font-medium text-sm shadow-sm transition">
                Today
            </button>
            <h2 class="text-xl font-medium text-gray-700">October 2026</h2>
        </div>

        <div class="flex items-center space-x-3">
            <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-200">
                Resource View: Seats 1 - 7
            </span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Controls -->
        <aside class="w-56 border-r border-gray-200 p-4 bg-gray-50 flex flex-col justify-between hidden md:flex">
            <div>
                <h3 class="font-bold text-xs text-gray-500 uppercase tracking-wider mb-3">Filter Seats</h3>
                <div class="space-y-2 text-sm" id="seat-filters">
                    <!-- Dynamic Checkboxes -->
                </div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-gray-200 text-xs text-gray-500 shadow-sm">
                <p>💡 <strong>Exact Days Sync:</strong> Mapped accurately from source table patterns.</p>
            </div>
        </aside>

        <!-- Main Calendar Area -->
        <main class="flex-1 flex flex-col overflow-auto bg-white relative">
            
            <!-- Sticky Days Header (Columns) -->
            <div class="grid grid-cols-8 border-b border-gray-200 bg-white sticky top-0 z-10 text-xs font-medium text-gray-500 text-center">
                <div class="p-3 border-r border-gray-100 bg-gray-50">GMT+0</div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">THU</span><span class="text-base font-normal text-gray-800">1</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">SAT</span><span class="text-base font-normal text-gray-800">3</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">SUN</span><span class="text-base font-normal text-gray-800">4</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">MON</span><span class="text-base font-normal text-gray-800">5</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">TUE</span><span class="text-base font-normal text-gray-800">6</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">WED</span><span class="text-base font-normal text-gray-800">7</span></div>
                <div class="p-2 border-r border-gray-100"><span class="text-gray-400 block text-[10px]">THU</span><span class="text-base font-normal text-gray-800">8</span></div>
            </div>

            <!-- Time Grid & Columns -->
            <div class="grid grid-cols-8 flex-1 min-h-[600px] relative">
                
                <!-- Hours Sidebar Column -->
                <div class="border-r border-gray-100 text-[11px] text-gray-400 text-right pr-2 select-none bg-gray-50/50">
                    <div class="hour-row border-b border-gray-100 pt-1">08:00 AM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">09:00 AM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">10:00 AM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">11:00 AM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">12:00 PM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">01:00 PM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">02:00 PM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">03:00 PM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">04:00 PM</div>
                    <div class="hour-row border-b border-gray-100 pt-1">05:00 PM</div>
                </div>

                <!-- 7 Day Columns (Isolated Day Containers) -->
                <script>
                    const days = [1, 3, 4, 5, 6, 7, 8];
                    days.forEach(day => {
                        document.write(`
                            <div id="day-col-${day}" class="border-r border-gray-100 relative h-full">
                                ${'<div class="hour-row border-b border-gray-100"></div>'.repeat(10)}
                            </div>
                        `);
                    });
                </script>
            </div>
        </main>
    </div>

    <!-- Event Detail Modal -->
    <div id="modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl p-5 w-80 shadow-2xl relative border border-gray-100">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-sm">✕</button>
            <div class="flex items-center space-x-2 mb-3">
                <span id="modal-color" class="w-3.5 h-3.5 rounded-full"></span>
                <h3 class="text-sm font-bold text-gray-800" id="modal-title">Booking Details</h3>
            </div>
            <div class="space-y-2 text-xs text-gray-600 border-t pt-3" id="modal-body"></div>
        </div>
    </div>

    <script>
        // Exact dataset mapping strictly parsed from source table
        const rawBookings = [
            // Seat 1 - ID 400838942: Sun 4, Tue 6, Thu 8...
            { 
                seat: 1, 
                id: '400838942', 
                time: '09:00-12:00', 
                startHour: 9, 
                endHour: 12, 
                activeDays: [4, 6, 8], 
                color: 'bg-blue-600 border-blue-700' 
            },
            // Seat 1 - ID 409491750: Thu 1, Mon 5, Wed 7...
            { 
                seat: 1, 
                id: '409491750', 
                time: '10:00-16:00', 
                startHour: 10, 
                endHour: 16, 
                activeDays: [1, 5, 7], 
                color: 'bg-indigo-600 border-indigo-700' 
            },

            // Seat 2 - ID 408471282: Sun 4, Tue 6, Thu 8...
            { seat: 2, id: '408471282', time: '10:00-12:00', startHour: 10, endHour: 12, activeDays: [4, 6, 8], color: 'bg-emerald-600 border-emerald-700' },
            // Seat 2 - ID 411151855: Thu 1, Mon 5, Wed 7...
            { seat: 2, id: '411151855', time: '13:00-16:00', startHour: 13, endHour: 16, activeDays: [1, 5, 7], color: 'bg-teal-600 border-teal-700' },

            // Seat 3 - ID 407135748: Sun 4, Wed 7
            { seat: 3, id: '407135748', time: '09:00-17:00', startHour: 9, endHour: 17, activeDays: [4, 7], color: 'bg-amber-600 border-amber-700' },
            // Seat 3 - ID 407921923: Thu 8...
            { seat: 3, id: '407921923', time: '10:00-17:00', startHour: 10, endHour: 17, activeDays: [8], color: 'bg-orange-600 border-orange-700' },

            // Seat 4 - Daily
            { seat: 4, id: '408404820', time: '09:00-17:00', startHour: 9, endHour: 17, activeDays: [1, 3, 4, 5, 6, 7, 8], color: 'bg-rose-600 border-rose-700' },

            // Seat 5 - Sat 3, Sun 4, Mon 5, Tue 6, Wed 7, Thu 8...
            { seat: 5, id: '403739758', time: '10:00-15:00', startHour: 10, endHour: 15, activeDays: [3, 4, 5, 6, 7, 8], color: 'bg-purple-600 border-purple-700' },

            // Seat 6 - Daily
            { seat: 6, id: '407976984', time: '09:00-17:00', startHour: 9, endHour: 17, activeDays: [1, 3, 4, 5, 6, 7, 8], color: 'bg-cyan-600 border-cyan-700' },

            // Seat 7 - Daily
            { seat: 7, id: '404020828', time: '09:00-16:00', startHour: 9, endHour: 16, activeDays: [1, 3, 4, 5, 6, 7, 8], color: 'bg-pink-600 border-pink-700' }
        ];

        // Sidebar Seat Checkboxes Generation
        const seatFiltersContainer = document.getElementById('seat-filters');
        const uniqueSeats = [...new Set(rawBookings.map(b => b.seat))];
        
        uniqueSeats.forEach(seat => {
            const label = document.createElement('label');
            label.className = 'flex items-center space-x-2 cursor-pointer hover:bg-gray-200/60 p-1.5 rounded transition';
            label.innerHTML = `
                <input type="checkbox" checked value="${seat}" class="seat-checkbox rounded text-blue-600 w-4 h-4">
                <span class="font-medium text-gray-700 text-xs">Seat ${seat}</span>
            `;
            seatFiltersContainer.appendChild(label);
        });

        // Strict Event Renderer Engine
        function renderEvents() {
            const daysList = [1, 3, 4, 5, 6, 7, 8];
            const selectedSeats = Array.from(document.querySelectorAll('.seat-checkbox:checked')).map(cb => parseInt(cb.value));

            // Clear previous cards
            daysList.forEach(day => {
                const col = document.getElementById(`day-col-${day}`);
                col.querySelectorAll('.event-card').forEach(e => e.remove());
            });

            // Filter selected seats
            const activeBookings = rawBookings.filter(b => selectedSeats.includes(b.seat));

            daysList.forEach(day => {
                const col = document.getElementById(`day-col-${day}`);
                const dayBookings = activeBookings.filter(b => b.activeDays.includes(day));

                dayBookings.forEach((b) => {
                    const hourHeight = 60; // 60px per hour slot
                    const topPos = (b.startHour - 8) * hourHeight;
                    const durationHeight = (b.endHour - b.startHour) * hourHeight;

                    const card = document.createElement('div');
                    card.className = `event-card absolute ${b.color} text-white rounded p-2 shadow-sm text-xs cursor-pointer hover:brightness-105 transition border border-white/20 overflow-hidden flex flex-col justify-between w-[calc(100%-4px)] left-[2px]`;
                    
                    card.style.top = `${topPos + 1}px`;
                    card.style.height = `${durationHeight - 2}px`;

                    card.innerHTML = `
                        <div>
                            <div class="font-bold text-[11px] leading-tight truncate">Seat ${b.seat} • ID ${b.id}</div>
                            <div class="text-[10px] opacity-90">${b.time}</div>
                        </div>
                    `;

                    card.onclick = () => showModal(b);
                    col.appendChild(card);
                });
            });
        }

        function showModal(b) {
            document.getElementById('modal-color').className = `w-3.5 h-3.5 rounded-full ${b.color}`;
            document.getElementById('modal-title').innerText = `Seat ${b.seat} - Booking Details`;
            document.getElementById('modal-body').innerHTML = `
                <div class="flex justify-between"><strong>Booking ID:</strong> <span>${b.id}</span></div>
                <div class="flex justify-between"><strong>Time Slot:</strong> <span>${b.time}</span></div>
                <div class="flex justify-between"><strong>Status:</strong> <span class="text-green-600 font-bold">Confirmed</span></div>
            `;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        document.querySelectorAll('.seat-checkbox').forEach(cb => {
            cb.addEventListener('change', renderEvents);
        });

        // Initial Execution
        renderEvents();
    </script>
</body>
</html>
